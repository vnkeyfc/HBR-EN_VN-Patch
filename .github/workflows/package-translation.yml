# Packs the community patch zip from this repo's src/ folder and publishes it as a release, for releases that only
# update the translation: the plugin DLLs, BepInEx and the configs are packed as src/ has them. It packs the commit the
# run is on, so the branch or tag picked in "Use workflow from". The tag is the packing date in Vietnam: v.DD.MM.YYYY
# for a stable release, v.DD.MM.YYYY-beta (then -beta1, -beta2 on the same day) for a test release; see
# .github/scripts/package_translation.py.
name: Package translation release

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: "beta = bản thử nghiệm (pre-release, tag -beta), none = bản ổn định (tag không hậu tố, mỗi ngày một bản)"
        type: choice
        options: [beta, none]
        default: beta
      notes:
        description: "Ghi chú thêm vào đầu Changelog (tuỳ chọn), mỗi ý cách nhau bằng dấu |"
        type: string
        default: ""
      draft:
        description: "Tạo bản nháp: chưa công khai, installer chưa thấy; sửa ghi chú xong rồi đăng"
        type: boolean
        default: false
      compare_from:
        description: "Liệt kê thay đổi từ tag/commit này (để trống = từ bản release trước)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: package-translation-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The repo stores text files with LF; the game folder and the earlier zips have CRLF.
      - name: Check out text files with CRLF
        run: git config --global core.autocrlf true

      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/existing-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' >> "$RUNNER_TEMP/existing-tags.txt"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not)][0] // null' > "$RUNNER_TEMP/previous-release.json"

      - name: Pack the zip and write the release notes
        id: package
        env:
          SUFFIX: ${{ inputs.suffix }}
          NOTES: ${{ inputs.notes }}
          COMPARE_FROM: ${{ inputs.compare_from }}
        run: |
          python3 .github/scripts/package_translation.py \
            --source . \
            --source-repo "$GITHUB_REPOSITORY" \
            --release-repo "$GITHUB_REPOSITORY" \
            --suffix "$SUFFIX" \
            --notes "$NOTES" \
            --compare-from "$COMPARE_FROM" \
            --existing-tags "$RUNNER_TEMP/existing-tags.txt" \
            --previous-release "$RUNNER_TEMP/previous-release.json" \
            --out "$RUNNER_TEMP/out"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
          ASSET: ${{ steps.package.outputs.asset }}
          NOTES_FILE: ${{ steps.package.outputs.notes }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          # The tag goes on the packed commit.
          args=(--repo "$GITHUB_REPOSITORY" --title "$NAME" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease); state="Bản thử nghiệm (pre-release)"
          else
            args+=(--latest); state="Bản ổn định (latest)"
          fi
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
            state="Bản nháp, chưa đăng: $state. Installer và trang chính của repo chưa thấy bản này cho tới khi bấm Publish."
          fi
          # gh prints the release's URL; a draft has no tag yet, so its URL is releases/tag/untagged-...
          url=$(gh release create "$TAG" "$ASSET" "${args[@]}")
          echo "$url"
          {
            echo ""
            echo "### Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Trạng thái | $state |"
            echo "| Link | $url |"
          } >> "$GITHUB_STEP_SUMMARY"
