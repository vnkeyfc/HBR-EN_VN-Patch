################################################################################
# HBRTLFixUp plugin config
# Dùng True hoặc False. Dòng bắt đầu bằng # sẽ bị bỏ qua.
# Không thay đổi cấu hình nếu bạn không biết rõ tác dụng của tùy chọn.
################################################################################

# Text và XUnity.AutoTranslator
# Bật override text từ BepInEx/Translation/vi/Overrides/*.txt.
EnableTextOverride=True

# Nạp sẵn cache dịch trước hiệu ứng gõ chữ.
EnableTypewriterPreTranslate=True

# Ẩn các dòng log regex không cần thiết của XUnity.AutoTranslator.
SuppressXuatRegexLogs=True

# Lua
# Dịch Lua theo file JSON trong BepInEx/Translation/vi/DumpData/LuaText.
# Câu thoại khớp theo mã giọng nói nên bản dịch vẫn dùng được khi game cập nhật Lua.
EnableLuaTextOverride=True

# Lyrics
# Áp lyric từ BepInEx/Translation/vi/DumpData/LyricsSubtitle/*.json.
EnableLyricsOverride=True

# Movie
# Thay movie bằng USM trong BepInEx/Translation/vi/DumpData/MovieOverride.
EnableMovieOverride=False

# TÍNH NĂNG THỬ NGHIỆM: hiện lại event Special đã kết thúc.
# Chỉ hỗ trợ cốt truyện; nhiệm vụ, cửa hàng và Prism Event bị vô hiệu hóa.
EnableArchivedSpecialEvents=False

# Master data
# Override UI theo Label/Text trong DumpData/MasterData/MasterLocalize.json.
EnableMasterBinOverride=False

# Override DescriptionLocalize của MasterTutorialDialog theo Label.
EnableMasterTutorialDialogOverride=True

# Override MessageLocalize của MasterBattleCutIn theo Label/MessageVietnamese.
EnableMasterBattleCutInOverride=True

# Override NameLocalize, TextLocalize và HowToGetLocalize của MasterItem theo Label trong file JSON.
EnableMasterItemOverride=True

# Override NameLocalize, InfoLocalize và PanelInfoLocalize của MasterSkill theo Label trong file JSON.
EnableMasterSkillOverride=False

# Override MessageLocalize của MasterCardVoice theo Label/MessageVietnamese trong file JSON.
EnableMasterCardVoiceOverride=False

# Định dạng hiển thị
# Đổi dấu phân cách số kiểu en-US sang kiểu Việt Nam trong text UI động.
UseVietnameseNumberSeparators=True

# Override MessageLocalize của MasterEncountCutIn theo Label/MessageVietnamese trong file JSON.
EnableMasterEncountCutInOverride=True

# TÍNH NĂNG THỬ NGHIỆM: hiện lời voice trong hộp thoại cạnh nhân vật ở màn hình Tiểu sử.
# Lời lấy từ BepInEx/Translation/vi/DumpData/CharacterVoice (Text, nếu trống thì Original).
# Chạm vào nhân vật để nghe lần lượt các câu chào của nhân vật đó.
EnableCharacterVoiceSubtitle=False

# Hiện ngày giờ của game (UTC-7) theo giờ Việt Nam (UTC+7): hạn event, cửa hàng, bảo trì...
ShowVietnamTime=True
