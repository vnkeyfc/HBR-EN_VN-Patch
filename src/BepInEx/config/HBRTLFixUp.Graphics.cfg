[Graphics]

## Run the game in borderless fullscreen.
# Setting type: Boolean
# Default value: true
EnableBorderlessWindow = true

## Borderless width. Use 0 for the current desktop resolution.
# Setting type: Int32
# Default value: 0
ResolutionWidth = 0

## Borderless height. Use 0 for the current desktop resolution.
# Setting type: Int32
# Default value: 0
ResolutionHeight = 0

## Override the game's frame-rate limit and disable VSync.
# Setting type: Boolean
# Default value: false
EnableFrameRateControl = false

## Target FPS. Use 0 for unlimited FPS.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 1000
TargetFrameRate = 0

## Keep field camera rotation and smoothing at 60 FPS speed when the frame rate is unlimited or above 60.
# Setting type: Boolean
# Default value: true
FixCameraFrameRate = true

[Welcome]

## Patch version (from hbr-vn_manifest.json) the title-screen welcome panel was last shown for. Clear it to show the panel again.
# Setting type: String
# Default value: 
ShownForVersion = 

